[project]
name = "fcgmb"
version = "0.2.0"
description = "Fragment-Constrained Generative Model Benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chembl_webresource_client",
    "polars",
    "rdkit",
    "meeko",
    "matplotlib",
    "seaborn",
    "scipy",
    "gemmi>=0.7.4",
    "prody>=2.4.1",
    "molscrub>=0.2.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
    "aiohttp>=3.9.0",
    "asttokens>=3.0.1",
    "comm>=0.2.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# This repo has many top-level output folders (data/, logs/, benchmark_runs/, etc.).
# Restrict package discovery to the actual Python package(s) only.
where = ["."]
include = ["fcgmb*"]
exclude = [
    "data*",
    "logs*",
    "benchmark_runs*",
    "generated_configs*",
    "custom_data*",
    "custom_configs*",
    "configs*",
    "*_workflow*",
    "variance_runs*",
    "variance_analysis*",
]

[tool.setuptools.package-data]
fcgmb = ["configs/*.yaml"]

[tool.ruff]
# Avoid linting large/generated artifacts.
extend-exclude = [
    ".venv",
    "benchmark_runs",
    "generated_configs",
    "data",
    "logs",
]

[tool.black]
# Keep formatting focused on source code only.
extend-exclude = """
(
  \\.venv
| benchmark_runs
| generated_configs
| data
| logs
)
"""

[tool.mypy]
# Type-check source only (ignore run outputs / generated files).
exclude = "(^\\.venv/|^benchmark_runs/|^generated_configs/|^data/|^logs/)"

[tool.pytest.ini_options]
# Prevent pytest from recursing into large output directories.
norecursedirs = [
    ".venv",
    "benchmark_runs",
    "generated_configs",
    "data",
    "logs",
]
