[project]
name = "mockdock"
version = "0.2.0"
description = "mockdock — Fragment-Constrained Generative Model Benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chembl_webresource_client",
    "polars",
    "rdkit",
    "meeko",
    "matplotlib",
    "seaborn",
    "scipy",
    "gemmi>=0.7.4",
    "molscrub>=0.2.2",
    "tqdm>=4.67.1",
    "aiohttp>=3.9.0",
    "asttokens>=3.0.1",
    "comm>=0.2.3",
    "pyarrow>=21.0.0",
    "click>=8.1.8",
]

[project.optional-dependencies]
# Vina docking backend (alternative to AutoDock-GPU)
vina = ["vina>=1.2.7"]
# Receptor preparation from raw PDB (only needed if pre-built grids are absent)
receptor = ["prody>=2.4.1"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# src/ layout: only look inside src/ for packages
where = ["src"]

[tool.setuptools.package-data]
mockdock = ["configs/*.toml", "grids/**/*", "bioactivity_data/*.csv", "data/*.csv"]

[tool.ruff]
line-length = 100
# Avoid linting large/generated artifacts.
extend-exclude = [
    ".venv",
    "benchmark_runs",
    "generated_configs",
    "data",
    "logs",
    "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
unfixable = []

[tool.mypy]
# Type-check source only (ignore run outputs / generated files)
exclude = "(\\.venv/|benchmark_runs/|generated_configs/|data/|logs/|results/)"

[tool.pytest.ini_options]
# Prevent pytest from recursing into large output directories.
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    "benchmark_runs",
    "generated_configs",
    "data",
    "logs",
    "results",
    "scripts",
]
addopts = "--tb=short -m 'not integration and not slow'"
markers = [
    "unit: fast deterministic unit tests",
    "integration: tests that exercise multiple components or external assets",
    "slow: tests with high runtime cost",
    "requires_vina: tests requiring the vina dependency/runtime",
    "requires_receptor_tools: tests requiring receptor preparation executables",
]

[tool.coverage.run]
source = ["src/mockdock"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
