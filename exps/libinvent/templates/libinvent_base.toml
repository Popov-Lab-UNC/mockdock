run_type = "staged_learning"
device = "__DEVICE__"
tb_logdir = "__TB_LOGDIR__"
json_out_config = "__JSON_OUT_CONFIG__"

[parameters]
summary_csv_prefix = "__SUMMARY_CSV_PREFIX__"
use_checkpoint = false
purge_memories = false

prior_file = "__PRIOR_FILE__"
agent_file = "__AGENT_FILE__"
smiles_file = "__SCAFFOLDS_FILE__"

batch_size = 64
unique_sequences = false
randomize_smiles = true
tb_isim = false

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4

[[stage]]
chkpt_file = "__CHKPT_FILE__"
termination = "null"
max_score = 1.0
min_steps = 1
max_steps = __MAX_STEPS__

[stage.scoring]
type = "arithmetic_mean"

[[stage.scoring.component]]
[stage.scoring.component.MockdockOracle]
[[stage.scoring.component.MockdockOracle.endpoint]]
name = "mockdock_score"
weight = 1.0

[stage.scoring.component.MockdockOracle.endpoint.params]
benchmark = "__BENCHMARK__"
budget = __BUDGET__
run_dir = "__RUN_DIR__"
docking_backend = "__DOCKING_BACKEND__"
clip_reward_upper_bound = __CLIP_REWARD_UPPER_BOUND__

